backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "contact"
    label: "Contact Section"
    files:
      - name: "contact"
        label: "Contact Section Text"
        file: "_data/contact.json"
        fields:
          - { label: "Eyebrow Text", name: "eyebrow", widget: "string", hint: "Small text above the heading e.g. 'No pressure, just a conversation'" }
          - { label: "Heading", name: "heading", widget: "string", hint: "Main heading e.g. 'Not sure where to start?'" }
          - { label: "Heading Emphasis", name: "heading_em", widget: "string", hint: "The italic part of the heading e.g. \"That's okay.\"" }
          - { label: "Subtext", name: "subtext", widget: "text", hint: "The paragraph below the heading" }
          - { label: "Submit Note", name: "submit_note", widget: "string", hint: "Small text next to the submit button e.g. \"I'll reply within a day or two. No spam, ever.\"" }
          - { label: "Button Text", name: "button_text", widget: "string", hint: "Submit button label e.g. 'Send it over →'" }
          - { label: "Success Heading", name: "success_heading", widget: "string", hint: "Heading shown after form is submitted e.g. 'Got it — talk soon!'" }
